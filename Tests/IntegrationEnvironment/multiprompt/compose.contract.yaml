# Integration contract only. The reviewed parent runner must gate engine/license,
# local context, fixed builder and both ownership labels before invoking Compose.
services:
  multiprompt:
    image: openlxssh-auth-mina-fixture:2.20.0-arm64
    build:
      context: .
    platform: linux/arm64
    labels:
      org.openlxssh.fixture: auth-mina-fixture-a
    user: "10000:10000"
    read_only: true
    privileged: false
    init: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    ulimits:
      nofile: {soft: 1024, hard: 1024}
      core: {soft: 0, hard: 0}
    tmpfs:
      - /run/openlxssh-multiprompt:rw,nosuid,nodev,noexec,size=16m,mode=0700,uid=10000,gid=10000
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    networks: [multiprompt-private]
    ports: ["127.0.0.1:22225:2222"]
    logging: {driver: none}
    stop_grace_period: 5s
    healthcheck:
      test: [CMD, python3, /opt/multiprompt/control.py, health, --authorized-run]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
networks:
  multiprompt-private:
    internal: true
    labels:
      org.openlxssh.fixture: auth-mina-fixture-a
