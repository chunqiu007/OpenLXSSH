# Managed through fixture.sh only after the user authorizes this environment.
x-server: &server
  image: openlxssh-integration-environment:ubuntu24.04-arm64
  build:
    context: .
    args:
      UBUNTU_IMAGE: ${OPENLXSSH_UBUNTU_IMAGE:?provide docker.io/library/ubuntu:24.04@sha256:digest}
  platform: linux/arm64
  labels:
    org.openlxssh.fixture: env-fixture-a
  read_only: true
  privileged: false
  init: true
  restart: "no"
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  # OpenSSH's root monitor drops IDs, sets group lists and enters its privilege
  # separation jail. The fixed-image PTY audit A/B also requires AUDIT_WRITE
  # for each authentication mode. No AUDIT_CONTROL/NET_ADMIN/SYS_ADMIN or host namespaces.
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SYS_CHROOT, KILL, AUDIT_WRITE]
  cpus: 0.5
  mem_limit: 384m
  memswap_limit: 384m
  pids_limit: 128
  ulimits:
    nofile: {soft: 1024, hard: 1024}
  tmpfs:
    - /run:rw,nosuid,nodev,noexec,size=96m,mode=0755
    - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
  networks: [fixture]
  stop_grace_period: 5s
  # PAM never logs replies; disable the engine's persistent container log too.
  logging:
    driver: none
  healthcheck:
    test: [CMD, python3, /opt/openlxssh-fixture/server.py, health, --authorized-run]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 90s

services:
  keyonly:
    <<: *server
    # Fixed-image A/B isolated AUDIT_WRITE bit29 as the missing PTY audit write.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SYS_CHROOT, KILL, AUDIT_WRITE]
    command: [serve, --authorized-run, --mode, keyonly]
    ports:
      - "127.0.0.1:22221:2222"
    volumes:
      - key-data:/fixture
  passwordonly:
    <<: *server
    command: [serve, --authorized-run, --mode, passwordonly]
    ports:
      - "127.0.0.1:22222:2222"
    volumes:
      - password-data:/fixture
  key-kbd:
    <<: *server
    command: [serve, --authorized-run, --mode, key-kbd]
    ports:
      - "127.0.0.1:22223:2222"
    volumes:
      - key-kbd-data:/fixture
  password-kbd:
    <<: *server
    command: [serve, --authorized-run, --mode, password-kbd]
    ports:
      - "127.0.0.1:22224:2222"
    volumes:
      - password-kbd-data:/fixture

networks:
  fixture:
    internal: true
    labels:
      org.openlxssh.fixture: env-fixture-a
volumes:
  key-data:
    labels: {org.openlxssh.fixture: env-fixture-a}
  password-data:
    labels: {org.openlxssh.fixture: env-fixture-a}
  key-kbd-data:
    labels: {org.openlxssh.fixture: env-fixture-a}
  password-kbd-data:
    labels: {org.openlxssh.fixture: env-fixture-a}
